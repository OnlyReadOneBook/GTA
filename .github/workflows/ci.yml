name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
        working-directory: gta checkout
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          path: gta checkout
          fetch-depth: 0
          persist-credentials: false

      - name: Collect changed paths
        id: changes
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'changed-files.txt'
          $full = 'false'
          $changed = @()
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $base = '${{ github.event.pull_request.base.sha }}'
            $head = '${{ github.sha }}'
            $changed = @(& git diff --name-only "$base" "$head")
            if ($LASTEXITCODE -ne 0) { throw 'Could not calculate pull request changed paths.' }
          } elseif ($env:GITHUB_EVENT_NAME -eq 'push') {
            $before = '${{ github.event.before }}'
            $head = '${{ github.sha }}'
            if ($before -match '^0+$') { $full = 'true' }
            else {
              $changed = @(& git diff --name-only "$before" "$head")
              if ($LASTEXITCODE -ne 0) { throw 'Could not calculate push changed paths.' }
            }
          } else {
            $full = 'true'
          }
          [IO.File]::WriteAllLines($path, [string[]]$changed, (New-Object Text.UTF8Encoding($false)))
          "full=$full" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "Changed paths: $($changed.Count); full suite: $full" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Download verified portable AutoHotkey
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'gta-ahk'
          $ahk = & .\tools\ci\install-autohotkey.ps1 -Destination $runtime
          "AHK_PATH=$ahk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run selected syntax and offline regression checks
        id: checks
        run: |
          $checkArgs = @{
            AhkPath = $env:AHK_PATH
            PythonPath = (Get-Command python).Source
            OutputDirectory = (Join-Path $env:RUNNER_TEMP 'gta-ci-results')
          }
          $changedFilesPath = Join-Path $env:RUNNER_TEMP 'changed-files.txt'
          if ('${{ steps.changes.outputs.full }}' -eq 'false' -and (Test-Path -LiteralPath $changedFilesPath)) {
            $checkArgs.ChangedFilesPath = $changedFilesPath
            "Changed paths consumed: $(@(Get-Content -LiteralPath $changedFilesPath -Encoding UTF8).Count)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          } else {
            Write-Output 'Changed paths unavailable or full run requested; using the full suite.'
          }
          & .\tools\ci\run-checks.ps1 @checkArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $results = Get-Content (Join-Path $env:RUNNER_TEMP 'gta-ci-results\results.json') -Raw | ConvertFrom-Json
          $package = if ($results.verificationScope -eq 'full' -and $results.selectedPlan.packageRequired) { 'true' } else { 'false' }
          "package=$package" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check DJ evidence preservation
        run: python -m unittest discover -s tools/dj-evidence -p 'test_*.py' -v

      - name: Package verified macro sources
        if: steps.checks.outputs.package == 'true'
        run: |
          & .\tools\ci\package-macro.ps1 -CheckResults (Join-Path $env:RUNNER_TEMP 'gta-ci-results\results.json') -OutputDirectory (Join-Path $env:RUNNER_TEMP 'gta-package')

      - name: Save check logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gta-ci-results/
            ${{ runner.temp }}/gta-ahk/installation.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Save macro ZIP
        if: steps.checks.outputs.package == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gta-macro-${{ github.sha }}
          path: |
            ${{ runner.temp }}/gta-package/*.zip
            ${{ runner.temp }}/gta-package/*.sha256
          if-no-files-found: error
          retention-days: 14
