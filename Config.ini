[Features]
; Teleport = CEO/MC 재등록 텔레포트(옛 방식). 해체 → 폰 Quick Join → Random·Alone·Yes → 재등록을 칸 수만 세어 눌러, 해체 뒤 눈 감고 누르는 키가 작업 로비에서 나간 적이 있다(0926). 같은 순서를 화면 확인과 함께 F11 앞단(JobWarpQuickJoin)으로 옮겼으니 이것은 꺼 둔다
Teleport=0
AltF4Teleport=1
; 스팀 봇 작텔(BotWarp, F10 두 번). 작업을 시작해 로딩되는 동안 공개 스팀 봇에 Join Game 을 걸어 작업 출발점에 떨어진다. 사용법은 아래 [Settings] BotWarp* 위 주석
BotWarp=1
FriendWarp=1
Movement=1
AutoClick=1
Timer=1
CasinoFingerprint=0
ClawMachine=1
AntiAFK=1
SessionSwitch=1
MenuMacros=1
; 수익 자동화(벙커 보급·DJ 교체·사업장 금고·현장 파견 스케줄러, 아래 [Settings] Earn* 참고)
Earner=1

[Hotkeys]
; 게임 창이 앞일 때만 잡힌다 (Exit 만 전역). 쉼표로 키를 더 붙일 수 있다 (예: ClawLoop=NumpadMult,F4)
; 넘패드 숫자·점은 NumLock 이 꺼져 있어도 같이 잡힌다. F4/F5/Pause 는 수식어 조합(Alt+F4, Ctrl+Shift+F5, Ctrl+Pause)을 통과시킨다.
ClawAttempt=
ClawLoop=
AntiAFK=
InviteOnlySession=
Run=
AutoClick=
WalkCtrl=
; 스팀 봇 작텔 (두 번 눌러 실행): 지도에서 작업 블립을 골라 화면 아래 "Start Job (Space)" 가 보일 때 누른다. 따로 실행하는 KeyHoldTest.ahk·LCtrlSpammer.ahk 도 F10 을 쓰니 함께 켜지 않는다
BotWarp=
FriendWarp=ScrollLock
CayoPericoTimer=
Snack=
; 판매 차례 알림 켜고 끄기: 디코 오버레이 판매 대기열 맨 위가 SaleAlertName 이 되면 한 번 알리고 스스로 꺼진다
SaleAlert=
; 랜선 뽑기: 누르고 있는 동안 GTA 네트워크를 끊고 떼면 되돌린다. 방식·어댑터는 아래 [Settings] LagSwitch*
LagSwitch=F8
Help=
StopAll=End
Exit=Pause
; 아래는 키를 비워 둔 기능. 쓰려면 키 이름을 적는다.
TeleportMC1=
TeleportMC2=
TeleportAltF4=
; 수익 자동화 켜기/끄기 (두 번 눌러 실행)
Earner=F9
Walk=
CasinoFingerprint=

[Settings]
; 클릭 설정
ClickInterval=1
ClickHoldTime=50

; 키 입력 설정
KeyHoldTime=100

; 두 번 눌러야 실행하는 기능(초대 전용 세션·텔레포트)의 두 번째 누름 허용 시간(ms)
ConfirmWindowMs=2000
; 도움말 툴팁이 떠 있는 시간(ms)
HelpShowMs=8000

; 텔레포트·메뉴 설정 (상호작용 메뉴 매크로도 MenuOpenDelay/MenuControlDelay 를 쓴다)
MenuOpenDelay=400
PhoneOpenDelay=1000
MenuControlDelay=120
PhoneControlDelay=150

MCDisbandDelay=1000
PhoneCloseDelay=1000

TeleportWaitTime=38000
TeleportTimerInterval=100

; 새 F4 텔레포트 설정
TeleportEnterDuration=100000
TeleportEnterInterval=50
TeleportClickToEnterDelay=4000
; 작텔(TeleportAltF4, F11 두 번): 작업 시작→확인 간격 / 확인→Alt+F4 간격 / 종료창 No/Yes 안내를 기다리는 최대 시간 / No 를 누르기 전 최소 대기 / 안내 뜬 뒤 여유. 0926 실측: 안내는 약 20초에 뜨지만 32초에 No 는 작업 로비(실패), 60초에 No 는 작업 위치(성공 2회). 최소 대기를 줄이지 말 것
JobWarpStartToConfirmMs=1200
JobWarpConfirmToAltF4Ms=900
JobWarpQuitWaitMs=90000
JobWarpMinWaitMs=60000
JobWarpAfterPromptMs=1500
; F11 두 단계 (Features\Teleport\QuickJoinPrep.ahk). 1 이면 첫 F11 두 번이 보스 해제 → 폰 Quick Join → Random → Alone → Yes → 곧바로 보스 등록까지 하고 "작텔 준비됨" 이 된다.
; 그다음 prep 을 시작하고 지도에서 작업 아이콘에 커서를 올려 F11 두 번이면 위 Alt+F4 작텔. 0 이면 F11 두 번이 바로 Alt+F4 작텔(예전 동작)
; 키마다 선택 줄을 Images\JobWarp\<해상도>\ 템플릿으로 확인하고, 안 보이면 더 누르지 않고 멈춘다. 1920x1080 CEO 템플릿은 0927 에 떴다(tools\build-jobwarp-templates.ps1). 다른 해상도·MC 는 템플릿이 없어 그 단계에서 멈춘다
JobWarpQuickJoin=1
; 다시 등록할 보스 종류(CEO 또는 MC) / 준비됨 상태가 풀리는 시간(분) / 해제·등록 뒤 메뉴로 확인하기 전 대기(ms)
JobWarpBossRole=CEO
JobWarpArmMaxMin=30
JobWarpRetireWaitMs=300
JobWarpRegisterWaitMs=300
; 스팀 봇 작텔(BotWarp, F10 두 번). 쓰는 법: 지도에서 작업 블립을 골라 화면 아래 "Start Job (Space)" 가 보일 때 두 번 누른다. 도착지는 고른 작업의 출발점이다
; 지도에 작업 블립이 없으면 P → ONLINE → Jobs → Play Job 에서 작업을 골라 CONFIRM 창이 뜬 상태에서 두 번 눌러도 된다
; 흐름: Space → CONFIRM 에 Enter(작업 로딩) → 스팀 그룹 채팅 "CCYXJ差传" 창을 노트북 화면 오른쪽 위로 옮겨 멤버 필터 CCYXJ → 봇 우클릭 → Join Game → GTA 로 돌아와 알림(다른 세션 참가 / 조준 모드 다름 / incompatible assets)마다 Enter → 약 20초 뒤 도착
; 준비: Images\BotWarp\steam\join_game.png(봇 우클릭 메뉴의 Join Game 글자 조각)가 있어야 시작한다. 스팀 채팅 창은 열어 둔다(초대 링크로 자동으로 열려면 open_in_steam.png·join_group_chat.png 도 필요). 노트북 화면 배율 175%, 게임 화면 16:9
; 안전: Esc 는 보내지 않는다. 알림은 노란 로고 폭과 흰 구분선 폭으로 가려 위 순서의 알림에만 Enter 하고, quit 로고(게임 종료·세션 나가기·스토리 모드)에는 아무 키도 보내지 않는다. Join Game 뒤 키보드를 누르면 넘겨받은 것으로 보고 멈춘다. 중단은 End
; 도착한 세션에서 다시 Start Job 을 누르면 "Currently unavailable" 이 뜬다. 매크로가 Backspace 로 닫고 멈추니 초대 전용 세션(F5 두 번)으로 옮긴 뒤 다시 한다
; 참조 이미지 만드는 법·판정 값·좌표 설명은 Features\Teleport\BotWarp.ahk 맨 위, 진행 기록은 %TEMP%\gta-macro.log 의 [botwarp] 줄(알림마다 로고 폭·구분선 폭을 남긴다)
; Space 뒤 CONFIRM 을 기다리는 최대 시간 / 알림을 본 뒤 Enter 까지 / CONFIRM 에 Enter 한 뒤 스팀으로 넘어가기 전 대기 (ms)
BotWarpConfirmTimeoutMs=4000
BotWarpAlertEnterDelayMs=600
BotWarpAfterConfirmMs=1000
; 스팀 클릭 사이 간격 / 멤버 필터를 적은 뒤 목록이 걸러질 때까지 (ms) / 어느 봇에 참가할지 (1: 差传CCYXJ01, 2: 差传CCYXJ03. 이름 이미지 Images\BotWarp\steam\bot1.png·bot2.png 로 찾는다)
BotWarpSteamStepMs=600
BotWarpSteamFilterMs=800
BotWarpBotRow=1
; Join Game 뒤 첫 알림을 기다리는 최대 시간 / 알림에 Enter 할 때마다 다음 알림이나 도착(체력 막대)까지 기다리는 최대 시간 (ms) / Join Game 뒤 Enter 를 보낼 알림 종류 수 상한 (다른 세션 참가 → 조준 모드 → incompatible assets, 이 순서로)
BotWarpJoinAlertTimeoutMs=20000
BotWarpArriveTimeoutMs=90000
BotWarpMaxJoinAlerts=3

; 카요 페리코 쿨타임 설정
CayoCooldownMinutes=48
VellumDrivingCtrlInterval=3000

; 인형 뽑기 설정 - 키 조작은 화면 안내를 확인하며 진행한다
; Forward/Right 는 1920x1080, RT 켬, DLSS 품질/FG 2X, 프레임 제한 120에서 집게 위치를 확인한 값
ClawForwardMs=5000
ClawRightMs=5000
ClawEnterTimeout=15000
ClawResultTimeout=30000

; 세션 이동 메뉴 조작 간격
SessionMenuDelay=600

; AFK 방지 - 이 시간 동안 사용자 입력이 없을 때만 누른다 / 누르는 간격과 흔들림 / 누르는 길이와 사이 간격 / 매크로 시작 시 켤지
AFKUserIdleSec=120
; MCT 앞이 아닌 빈 화면에서는 물리·원격(주입) 입력이 모두 이 초 넘게 없을 때만 Z 두 번(미니맵 확대 왕복)을 누른다. 0 이면 빈 화면에서는 안 누른다
AFKFreeHudIdleSec=300
AFKIntervalSec=200
AFKJitterSec=20
AFKTapMs=150
AFKGapMs=250
AFKOnStart=1
; 다른 창이 GTA 포커스를 가져갔을 때 - 실제 키보드·마우스 입력과 원격 데스크톱·에이전트가 넣는 입력이 둘 다 이 초 넘게 없을 때만 GTA 를 앞으로 가져온다(최소화면 복원). 0 이면 가져오지 않고 건너뛰기만 한다
; 짧게 잡으면 자리에 있는 사람의 창을 뺏는다. AFKUserIdleSec 보다 작으면 AFKUserIdleSec 이 기준이 된다. 게임의 방치 킥은 입력 없이 15분(0928 실측). Main 만 읽는다(afk-guard.ahk 는 안 읽는다)
AFKRefocusIdleSec=45
; GTA 를 앞으로 가져온 뒤 첫 입력까지 기다리는 시간(ms)
AFKRefocusSettleMs=800

; 게임 화면 위 상태 표시(오버레이) - 켤지 / 오른쪽 끝의 가로 위치(%) / 위쪽 끝의 세로 위치(%). 작텔 종료창 안내 감지(오른쪽 아래 구석)·인형 뽑기 안내 검색(왼쪽 위)·화면 가운데를 덮는 위치면 기본 위치(98, 18)로 되돌린다
OverlayEnabled=1
OverlayXPct=100
; 1003: 오른쪽 위는 디코 오버레이(DiscordChatHUD)가 차지해서 그 아래로 내렸다
OverlayYPct=85
; 디코 오버레이(DiscordChatHUD, 남이 만든 별도 프로그램) 실행 파일. Main 을 켤 때 안 떠 있으면 같이 띄운다. 비우면 띄우지 않는다.
DiscordHUDPath=%LOCALAPPDATA%\Programs\DiscordChatHUD\DiscordChatHUD.exe
DiscordHUDAppID=alex6483.DiscordChatHUD_dc909tavazxht!DiscordChatHUD
; 판매 차례 알림(단축키 SaleAlert 로 켬): 디코 오버레이 채팅 아래 판매 대기자 맨 위가 이 이름이 되면 소리·툴팁으로 한 번 알리고 꺼진다 / 확인 간격(초)
SaleAlertName=WhatCanUDo
SaleAlertIntervalSec=10

; 랜선 뽑기. Mode: suspend(GTA 프로세스만 멈춤·관리자 불필요·복구 즉시) 또는 adapter(어댑터 껐다 켬·관리자 필요·재연결 지연)
; 키를 쥐고 있는 동안 계속 끊는다(시간 상한 없음). Adapter 가 비면 연결된 물리 어댑터 첫 번째
LagSwitchMode=suspend
LagSwitchAdapter=

; 상호작용 메뉴 매크로 - 메뉴 맨 위(Quick GPS)에서 센 Down 횟수. 게임 버전·보유 자산·집 안 여부로 달라지면 여기만 고친다
; 내 부동산(아케이드·에이전시 등) 안에서는 맨 위에 '… Management' 줄이 한 줄 더 붙는다. 안이면 1, 밖이면 0 (0926 아케이드 실측: 안 1)
MenuTopOffset=1
; 스낵: M → Down x SnackMenuSteps (Health and Ammo) → Enter → Down x SnackSubSteps (Snacks) → Enter → Down x SnackItemSteps → Enter x SnackCount → M
SnackMenuSteps=4
SnackSubSteps=2
SnackItemSteps=0
SnackCount=1
SnackCloseMenu=1

; === 수익 자동화 (Earner, F9 두 번으로 켜고 끔, End 로 멈춤) ===
; 거점: 저택 마스터 컨트롤 터미널(MCT)의 사업장 목록 또는 MCT 전용 접근 안내가 확인되는 대기 위치. MCT 작업 중 필요한 동안만 CEO를 등록하고 끝나면 해제한다.
; 켜 두면 1초마다 할 일을 보고 때가 된 것 하나를 끝까지 한다. 시작 전 EarnUserIdleSec 초 동안 키보드·마우스 입력이 안정되기를 기다린다.
; 모든 단계는 화면 템플릿과 영어 OCR로 확인한다. 확인 실패 시 자동화를 끄고 AFK 방지는 켜 둔다. 까닭은 %TEMP%\gta-earn.log
; 금고는 GTA+ Vinewood Club 앱을 사용한다. 현재 MCT 전용 운용은 부동산 이동·재접속을 사용하지 않는다. 상세 정책: docs/earner-policy.md
; 키 사이 간격(ms) / 카메라 회전 계수는 MCT에서 일어난 뒤 시점을 되돌리는 데도 사용한다. 재접속·블립 값은 이전 이동 경로용이다.
EarnKeyDelay=350
EarnTurnUnitsPerDeg=29
EarnRerollMax=12
EarnReachPx=14
; 부동산 안에 들어간 뒤 걸어서 목표 블립에 못 닿으면 다시 들어가 보는 횟수
EarnWalkRetry=3
; 사용자 입력이 없어야 하는 시간(초, 2초면 플레이 중 잠깐 멈춘 틈에 MCT 작업이 끼어들어 1005 에 AFK 와 같은 45초로) / 재접속 뒤 최소 대기(초) / 재접속 뒤 게임 화면이 돌아오기를 기다리는 최대 시간(초)
EarnUserIdleSec=120
EarnLoadMinSec=8
EarnLoadTimeoutSec=240
; 사업장 금고: 켤지 / 금액을 못 읽었을 때의 관측 간격(분) / 켠 뒤 첫 관측까지(분). GTA+ Vinewood 앱 목록의 모든 금고를 읽고, 다음 입금이 그 금고 한도를 넘길 금액이면 수거하고 빈 금고 상세 문구를 확인한다. 한도·하루 입금 표는 EarnVinewood.ahk 의 EarnSafeLimits().
; 금액을 읽으면 수거할 때가 될 때까지 남은 입금 횟수(48분마다 최대 $50,000)로 다음 확인을 미룬다($0 이면 232분, $200,000 이면 40분 뒤).
EarnSafe=1
EarnSafeIntervalMin=5
EarnSafeFirstMin=0
; 길을 못 찾거나 재접속 자리가 나빠 못 갔을 때 몇 분 뒤 다시 할지 / 연속 몇 번 못 하면 자동화를 끌지
EarnSafeRetryMin=15
EarnSoftFailMax=12
; 휴대폰(Up 을 보내도 전화·앱이 안 열림)과 MCT(접근 안내·화면이 안 열림)가 게임 문제로 둘 다 이 횟수만큼 연속 안 먹으면 초대 전용 세션으로 다시 들어간다.
; 다시 들어가면 스폰 위치(저택 등)에서 시작하므로 MCT 수익은 끄고 바인우드 앱 작업만 계속한다. MCT 곁에서 F9 두 번으로 되돌린다. 0 이면 끔.
; 유휴 앱 모드(MCT 수익 꺼짐)에서는 휴대폰만 이 횟수에 닿으면 다시 들어간다.
EarnGlitchRejoinFails=3
; 1: 현재 MCT를 거점으로 벙커·DJ·창고 직원을 관리하고 금고는 Vinewood 앱에서 회수한다. 부동산 방문·파견·세션 이동은 제외한다.
EarnMCTOnly=1
; 벙커 보급: 켤지 / 기본 속도에서 목표 소모 시간(초). 1680의 1~5배만 허용. 기본 1680은 한 칸 소모마다(80·60·40·20·0% 경계) 그 칸 수 × $15,000을 확인하고 산다. 경계를 하나 놓쳐도 다음 경계가 한 칸 뒤라 보급이 비지 않는다(1025 22:33~22:59 6720에서 20%를 놓쳐 0%까지 약 15분 비었다).
; 최대 5분 관측은 구매 주기가 아니다. 예상 경계 3분 전 재관측을 예약하고 가까워지면 MCT에서 최대 4분 짧게 새로 읽는다.
; 재고 가득·배송 중에는 사지 않는다. 남은 보급으로 약 10분 배송 동안 생산하며, 배송 후 새 보급량부터 다시 계산한다. 8400의 빈 보급 주문은 배송 중 생산 공백이 있다.
EarnBunker=1
EarnBunkerIntervalSec=1680
; 나이트클럽 DJ 교체: 켤지 / 상태 관측 간격(분, 인기도 하락 시각을 알기 전까지만. 알고 나면 게임 하루 48분 경계에 맞춰 본다) / 목표(%). 기본 95는 정상 주기 90->100 재고용이며 95->100 교체는 하지 않는다.
EarnDJ=1
EarnDJIntervalMin=5
EarnDJPopularityPct=95
; 창고 직원: 켤지 / 관측 간격(분). 현재 재고·용량·직원 배정을 읽고 3품목 만재 알림 후 15분 이내 전량 판매하는 표준 계획모형의 최대 21개 배치를 비교한다. 기존 wh_rate 생산 추정으로 이 간격을 미루지 않는다. 자동 판매·만재 중단은 하지 않는다.
; 공통 보충 순위: south_american, pharmaceutical, cash, cargo, sporting, organic, printing. 부분재고의 보수 모형점수에 따라 생산 중인 직원도 옮길 수 있다. 실제 수익·전역 최적 보장은 아니며 docs/earner-policy.md의 모델 가정을 따른다.
EarnWarehouse=1
EarnWarehouseIntervalMin=10
; 바인우드 앱 직원 파견. 작업 중/만재는 건너뛰고 창고별 $7,500만 지불한다. 파견한 대상은 49분 뒤(게임 하루 48분 + 1분)에 다시 보고, 언제 보냈는지 모르는 작업 중 대상만 아래 간격으로 본다.
EarnBailAgents=1
EarnCargoStaff=1
EarnStaffIntervalMin=5
; 현장 파견: 켤지 / 간격(분) / 켠 뒤 첫 파견까지(분)
EarnDispatch=0
EarnDispatchIntervalMin=48
EarnDispatchFirstMin=0
AwayMode=0
AutoAwayIdleSec=120
